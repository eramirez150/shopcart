openapi: 3.0.3
info:
  title: ShopCart API de la tienda
  version: 1.0.0
  description: |
    Servicio de la tienda: rutas públicas en `/publico` y rutas del cliente con sesión en `/cliente`.
    La administración es otro servicio, con su propia documentación en el puerto 3001.

    **Autenticación.** Inicie sesión en `POST /publico/auth/login` (solo clientes), copie el `accessToken` y péguelo en el botón *Authorize*.
    El token dura 15 minutos: vencido responde 401 y se renueva con `POST /publico/auth/refresh`
    (cada refresh token sirve una sola vez). Un token o un refresh token de administración responde 401.

    **Carrito de invitado.** Sin sesión, envíe la cabecera `X-Carrito-Token`. El primer `POST /publico/carrito/items`
    sin token crea el carrito y devuelve su `TokenInvitado`. Al iniciar sesión con esa cabecera el carrito se fusiona con la cuenta.

    **Direcciones.** Cada cliente gestiona las suyas en `/cliente/direcciones`; la de otro usuario responde 404.
    `POST /cliente/checkout/pagos` recibe `idDireccion` o el texto de una dirección nueva, que queda registrada.

    **Reseñas.** El listado es público en `/publico/productos/{id}/resenas`. Crear una y consultar si se puede crear
    se hace en `/cliente/productos/{id}/resenas`, con un pedido `Entregado` que contenga el producto.

    **Orden.** Los listados aceptan `orden` y se ordenan en el servidor.

    **Montos** en quetzales con IVA incluido. **Errores** con la forma `{ "error": { "codigo", "mensaje", "detalle" } }`.
servers:
  - url: http://localhost:3000/api
security:
  - bearerAuth: []
tags:
  - { name: Auth }
  - { name: Catálogo }
  - { name: Reseñas }
  - { name: Carrito }
  - { name: Direcciones }
  - { name: Checkout }
  - { name: Pedidos }
paths:
  /salud:
    get:
      summary: Estado del servicio
      security: []
      responses:
        '200':
          description: El servicio responde
          content: { application/json: { example: { estado: ok, servicio: tienda } } }

  /publico/auth/registro:
    post:
      tags: [Auth]
      summary: Registra un cliente y abre sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example: { correo: nuevo@shopcart.test, clave: Clave-segura-1, nombre: Nora Nueva }
      responses:
        '201': { $ref: '#/components/responses/Sesion' }
        '400': { $ref: '#/components/responses/Validacion' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /publico/auth/login:
    post:
      tags: [Auth]
      summary: Inicia sesión de un Cliente (con X-Carrito-Token fusiona el carrito de invitado)
      description: Otro rol responde 401 igual que una clave incorrecta.
      security: []
      parameters:
        - { $ref: '#/components/parameters/CarritoToken' }
      requestBody:
        required: true
        content:
          application/json:
            example: { correo: cliente@shopcart.test, clave: Cliente123! }
      responses:
        '200': { $ref: '#/components/responses/Sesion' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /publico/auth/refresh:
    post:
      tags: [Auth]
      summary: Renueva la sesión; el refresh token enviado deja de servir
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example: { refreshToken: 'q3b1vH0...token-recibido-en-el-login' }
      responses:
        '200': { $ref: '#/components/responses/Sesion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /publico/auth/logout:
    post:
      tags: [Auth]
      summary: Revoca el refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example: { refreshToken: 'q3b1vH0...token-recibido-en-el-login' }
      responses:
        '204': { description: Sesión cerrada }

  /publico/categorias:
    get:
      tags: [Catálogo]
      summary: Lista categorías activas
      security: []
      responses:
        '200':
          description: Categorías
          content: { application/json: { example: [{ IDCategoria: 1, Nombre: Electrónica, Descripcion: 'Audio, video y accesorios', Activa: true }] } }
  /publico/productos:
    get:
      tags: [Catálogo]
      summary: Busca productos con filtros, orden y paginación
      security: []
      parameters:
        - { name: texto, in: query, schema: { type: string }, example: inalámbrico }
        - { name: idCategoria, in: query, schema: { type: integer }, example: 1 }
        - { name: precioMin, in: query, schema: { type: number }, example: 50 }
        - { name: precioMax, in: query, schema: { type: number }, example: 500 }
        - { name: soloDisponibles, in: query, schema: { type: boolean }, example: true }
        - { name: orden, in: query, schema: { type: string, enum: [nombre, precio_asc, precio_desc, recientes] }, example: precio_asc }
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/Tamano' }
      responses:
        '200':
          description: Página de productos
          content:
            application/json:
              example:
                total: 1
                pagina: 1
                tamano: 20
                datos: [{ IDProducto: 9, Nombre: Mouse inalámbrico, IDCategoria: 2, Categoria: Computación, PrecioDesde: 89.9, PrecioHasta: 89.9, Disponible: 80, Variantes: 1, ImagenPrincipal: 'https://picsum.photos/seed/shopcart-9/600/600' }]
        '400': { $ref: '#/components/responses/Validacion' }
  /publico/productos/{id}:
    get:
      tags: [Catálogo]
      summary: Producto con sus variantes y disponible activos
      security: []
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Producto' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /publico/productos/{id}/relacionados:
    get:
      tags: [Catálogo]
      summary: Hasta 12 productos para sugerir, primero los de la misma categoría y luego otros al azar
      description: Solo productos activos con variantes activas, sin el producto actual, con la misma forma que el listado.
      security: []
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Productos relacionados
          content:
            application/json:
              example:
                - IDProducto: 2
                  Nombre: Bocina portátil
                  Descripcion: Bocina Bluetooth resistente al agua
                  IDCategoria: 1
                  Categoria: Electrónica
                  PrecioDesde: 299.9
                  PrecioHasta: 299.9
                  Disponible: 30
                  Variantes: 1
                  ImagenPrincipal: https://m.media-amazon.com/images/I/8165VSHcJlL._AC_UY436_FMwebp_QL65_.jpg
        '400': { $ref: '#/components/responses/Validacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /publico/productos/{id}/resenas:
    get:
      tags: [Reseñas]
      summary: Reseñas de un producto activo, las más recientes primero, con promedio y total
      description: Autor es el nombre y la inicial del apellido. Nunca se entrega el correo ni el id del usuario.
      security: []
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/Tamano' }
      responses:
        '200':
          description: Página de reseñas
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer, description: Filas que cumplen el filtro }
                  pagina: { type: integer }
                  tamano: { type: integer }
                  promedio: { type: number, nullable: true, description: Calificación promedio con dos decimales; null sin reseñas }
                  datos: { type: array, items: { $ref: '#/components/schemas/Resena' } }
        '400': { $ref: '#/components/responses/Validacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /publico/carrito:
    get:
      tags: [Carrito]
      summary: Carrito con subtotal, descuento y total (sesión o X-Carrito-Token)
      security: [{}, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CarritoToken' }]
      responses:
        '200': { $ref: '#/components/responses/Carrito' }
  /publico/carrito/items:
    post:
      tags: [Carrito]
      summary: Agrega una variante sin superar el disponible
      security: [{}, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CarritoToken' }]
      requestBody:
        required: true
        content: { application/json: { example: { idVariante: 1, cantidad: 2 } } }
      responses:
        '201': { $ref: '#/components/responses/Carrito' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /publico/carrito/items/{idVariante}:
    patch:
      tags: [Carrito]
      summary: Cambia la cantidad de una línea
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CarritoToken' }
        - { name: idVariante, in: path, required: true, schema: { type: integer }, example: 1 }
      requestBody:
        required: true
        content: { application/json: { example: { cantidad: 3 } } }
      responses:
        '200': { $ref: '#/components/responses/Carrito' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
    delete:
      tags: [Carrito]
      summary: Quita una línea
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/CarritoToken' }
        - { name: idVariante, in: path, required: true, schema: { type: integer }, example: 1 }
      responses:
        '200': { $ref: '#/components/responses/Carrito' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /publico/carrito/cupon:
    put:
      tags: [Carrito]
      summary: Aplica un cupón (uno por pedido); exige sesión porque el cupón tiene límite por cliente. El rechazo indica la causa
      requestBody:
        required: true
        content: { application/json: { example: { codigo: BIENVENIDA10 } } }
      responses:
        '200': { $ref: '#/components/responses/Carrito' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
    delete:
      tags: [Carrito]
      summary: Quita el cupón; exige sesión
      responses:
        '200': { $ref: '#/components/responses/Carrito' }

  /cliente/direcciones:
    get:
      tags: [Direcciones]
      summary: Direcciones activas del usuario autenticado
      responses:
        '200':
          description: Direcciones, la más reciente primero
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Direccion' } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    post:
      tags: [Direcciones]
      summary: Registra una dirección de entrega
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DireccionEntrada' }
            example: { direccion: 6a avenida 12-34 zona 1, ciudad: Guatemala, telefono: '55551234' }
      responses:
        '201':
          description: Dirección creada
          content: { application/json: { schema: { $ref: '#/components/schemas/Direccion' } } }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /cliente/direcciones/{id}:
    put:
      tags: [Direcciones]
      summary: Modifica una dirección propia y activa (la de otro usuario responde 404)
      description: Las reservas y los pedidos ya creados conservan el texto que copiaron.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DireccionEntrada' }
            example: { direccion: 7a avenida 1-23 zona 4, ciudad: Guatemala, telefono: '55551234' }
      responses:
        '200':
          description: Dirección actualizada
          content: { application/json: { schema: { $ref: '#/components/schemas/Direccion' } } }
        '400': { $ref: '#/components/responses/Validacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    delete:
      tags: [Direcciones]
      summary: Desactiva una dirección propia; no se borra porque puede estar en pedidos (la de otro usuario responde 404)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Dirección desactivada
          content: { application/json: { schema: { $ref: '#/components/schemas/Direccion' } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /cliente/checkout/pagos:
    post:
      tags: [Checkout]
      summary: Inicia el pago; reserva la existencia 15 minutos con precio y descuento congelados
      description: |
        Envíe `idDireccion` (una dirección propia y activa) o `direccion`, `ciudad` y `telefono` para registrar una nueva
        (si ya existe una idéntica se reutiliza). El texto queda copiado en la reserva y en el pedido.
        Repetir la llamada con el carrito sin cambios, la misma dirección y el mismo cupón devuelve la misma reserva activa (doble clic).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PagoEntrada' }
            examples:
              conDireccionGuardada: { value: { idDireccion: 1, codigoCupon: Q50 } }
              conDireccionNueva: { value: { direccion: 6a avenida 12-34 zona 1, ciudad: Guatemala, telefono: '55551234' } }
      responses:
        '201': { $ref: '#/components/responses/Reserva' }
        '400': { $ref: '#/components/responses/Validacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /cliente/checkout/reservas/{id}:
    get:
      tags: [Checkout]
      summary: Consulta una reserva propia
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Reserva' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    delete:
      tags: [Checkout]
      summary: Cancela el pago; anula la reserva y libera la existencia
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Reserva' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /cliente/checkout/reservas/{id}/pedido:
    post:
      tags: [Checkout]
      summary: Confirma el pago simulado y crea el pedido; repetir la llamada devuelve el mismo pedido
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '201': { $ref: '#/components/responses/Pedido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /cliente/pedidos:
    get:
      tags: [Pedidos]
      summary: Pedidos del cliente, filtrados y paginados
      parameters:
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoPedido' }, example: Pagado }
        - { name: desde, in: query, schema: { type: string, format: date }, example: '2026-11-01' }
        - { name: hasta, in: query, schema: { type: string, format: date }, example: '2026-11-30' }
        - { name: totalMin, in: query, schema: { type: number }, example: 100 }
        - { name: totalMax, in: query, schema: { type: number }, example: 2000 }
        - { name: orden, in: query, schema: { type: string, enum: [recientes, antiguos, total_desc, total_asc], default: recientes }, example: total_desc }
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/Tamano' }
      responses:
        '200':
          description: Página de pedidos
          content:
            application/json:
              example:
                total: 1
                pagina: 1
                tamano: 20
                datos: [{ IDPedido: 1, IDUsuario: 3, Cliente: Carla Cliente, Estado: Pagado, Subtotal: 1036.8, Descuento: 50, Total: 986.8, FechaCreacion: '2026-11-01T15:34:19.000Z' }]
  /cliente/pedidos/{id}:
    get:
      tags: [Pedidos]
      summary: Pedido con líneas e historial (un pedido ajeno responde 404)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Pedido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /cliente/pedidos/{id}/estado:
    patch:
      tags: [Pedidos]
      summary: Cancela un pedido propio antes del despacho; otro estado responde 403
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { example: { estado: Cancelado, comentario: Ya no lo necesito } } }
      responses:
        '200': { $ref: '#/components/responses/Pedido' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /cliente/pedidos/{id}/devoluciones:
    get:
      tags: [Pedidos]
      summary: Devoluciones de un pedido propio
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Devoluciones' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /cliente/productos/{id}/resenas:
    post:
      tags: [Reseñas]
      summary: Crea la reseña del cliente, que necesita un pedido Entregado con el producto
      description: Una por usuario y producto. Los pedidos `DevueltoParcial` y `Devuelto` no cuentan como compra para reseñar.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResenaEntrada' }
            example: { calificacion: 5, comentario: Muy buen producto. }
      responses:
        '201':
          description: Reseña creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resena' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: No compró el producto (`RESENA_SIN_COMPRA`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { codigo: RESENA_SIN_COMPRA, mensaje: Solo se puede reseñar un producto comprado y entregado. } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409':
          description: Ya existe una reseña de este usuario para el producto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { codigo: RESENA_DUPLICADA, mensaje: Este producto ya tiene una reseña de esta cuenta. } }
  /cliente/productos/{id}/resenas/permiso:
    get:
      tags: [Reseñas]
      summary: Indica si el cliente actual puede reseñar el producto
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Permiso del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  puede: { type: boolean }
                  motivo: { type: string, nullable: true, enum: [Rol, Repetida, SinCompra, null], description: null si puede reseñar }
              example: { puede: false, motivo: SinCompra }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
      example: 1
    Pagina:
      name: pagina
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
      example: 1
    Tamano:
      name: tamano
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      example: 20
    CarritoToken:
      name: X-Carrito-Token
      in: header
      description: Token del carrito de invitado (GUID)
      schema: { type: string, format: uuid }
      example: e458443c-0117-4ea6-a9f9-54a6c6bb7bd7
  schemas:
    EstadoPedido:
      type: string
      enum: [Pagado, EnPreparacion, Despachado, Entregado, DevueltoParcial, Devuelto, Cancelado]
    DireccionEntrada:
      type: object
      required: [direccion, ciudad, telefono]
      properties:
        direccion: { type: string, minLength: 1, maxLength: 300 }
        ciudad: { type: string, minLength: 1, maxLength: 100 }
        telefono: { type: string, minLength: 1, maxLength: 20 }
    Direccion:
      type: object
      properties:
        IDDireccion: { type: integer }
        Direccion: { type: string }
        Ciudad: { type: string }
        Telefono: { type: string }
        Activa: { type: boolean }
        FechaCreacion: { type: string, format: date-time }
      example: { IDDireccion: 1, Direccion: 6a avenida 12-34 zona 1, Ciudad: Guatemala, Telefono: '55551234', Activa: true, FechaCreacion: '2026-11-01T15:00:00.000Z' }
    PagoEntrada:
      type: object
      description: Requiere idDireccion, o bien direccion, ciudad y telefono.
      properties:
        idDireccion: { type: integer, minimum: 1, description: Dirección propia y activa }
        direccion: { type: string, minLength: 1, maxLength: 300 }
        ciudad: { type: string, minLength: 1, maxLength: 100 }
        telefono: { type: string, minLength: 1, maxLength: 20 }
        codigoCupon: { type: string, minLength: 1, maxLength: 30, description: Reemplaza al cupón del carrito }
      anyOf:
        - required: [idDireccion]
        - required: [direccion, ciudad, telefono]
    ResenaEntrada:
      type: object
      required: [calificacion, comentario]
      properties:
        calificacion: { type: integer, minimum: 1, maximum: 5 }
        comentario: { type: string, minLength: 1, maxLength: 1000 }
    Resena:
      type: object
      properties:
        IDResena: { type: integer }
        Autor: { type: string, description: Nombre e inicial del apellido }
        Calificacion: { type: integer, minimum: 1, maximum: 5 }
        Comentario: { type: string }
        Fecha: { type: string, format: date-time }
      example: { IDResena: 1, Autor: Lucía M., Calificacion: 5, Comentario: Muy buen producto., Fecha: '2026-11-01T15:00:00.000Z' }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            codigo: { type: string }
            mensaje: { type: string }
            detalle: {}
  responses:
    Validacion:
      description: Datos inválidos (400)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { codigo: VALIDACION, mensaje: Datos inválidos, detalle: [{ campo: cantidad, mensaje: 'Too small: expected number to be >=1' }] } }
    NoAutenticado:
      description: Sin token, token inválido o expirado (401)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { codigo: TOKEN_EXPIRADO, mensaje: El token expiró } }
