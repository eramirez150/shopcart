openapi: 3.0.3
info:
  title: ShopCart API de administración
  version: 1.0.0
  description: |
    Servicio de administración: todo es privado salvo `/admin/auth`. La tienda es otro servicio, con su propia documentación en el puerto 3000.

    **Autenticación.** Inicie sesión en `POST /admin/auth/login` (cualquier rol activo que no sea Cliente), copie el `accessToken` y péguelo en el botón *Authorize*.
    El token dura 15 minutos: vencido responde 401 y se renueva con `POST /admin/auth/refresh`. Un token de la tienda responde 401.

    **Permisos.** Cada ruta exige un permiso, consultado en la base en cada petición: quitarlo tiene efecto inmediato y sin él se responde 403.
    Tener `modulo.gestionar` incluye `modulo.ver`. El Administrador tiene todos.

    **Roles.** Solo el Administrador los gestiona. `Administrador` y `Cliente` son de sistema y no se editan.
    `roles.gestionar` no se puede asignar a ningún rol.

    **Orden.** Los listados aceptan `orden` y se ordenan en el servidor.

    **Montos** en quetzales con IVA incluido. **Errores** con la forma `{ "error": { "codigo", "mensaje", "detalle" } }`.
servers:
  - url: http://localhost:3001/api
security:
  - bearerAuth: []
tags:
  - { name: Auth }
  - { name: Usuarios }
  - { name: Roles }
  - { name: Catálogo }
  - { name: Inventario }
  - { name: Cupones }
  - { name: Pedidos }
  - { name: Dashboard }
  - { name: Bitácora }
paths:
  /salud:
    get:
      summary: Estado del servicio
      security: []
      responses:
        '200':
          description: El servicio responde
          content: { application/json: { example: { estado: ok, servicio: admin } } }

  /admin/auth/login:
    post:
      tags: [Auth]
      summary: Inicia sesión del personal (cualquier rol activo que no sea Cliente)
      description: Un Cliente responde 401 igual que una clave incorrecta.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example: { correo: admin@shopcart.test, clave: 'Admin123!' }
      responses:
        '200': { $ref: '#/components/responses/Sesion' }
        '400': { $ref: '#/components/responses/Validacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /admin/auth/refresh:
    post:
      tags: [Auth]
      summary: Renueva la sesión; el refresh token enviado deja de servir
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example: { refreshToken: 'q3b1vH0...token-recibido-en-el-login' }
      responses:
        '200': { $ref: '#/components/responses/Sesion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /admin/auth/logout:
    post:
      tags: [Auth]
      summary: Revoca el refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example: { refreshToken: 'q3b1vH0...token-recibido-en-el-login' }
      responses:
        '204': { description: Sesión cerrada }

  /admin/usuarios:
    get:
      tags: [Usuarios]
      summary: Lista usuarios (permiso usuarios.gestionar)
      parameters:
        - { name: rol, in: query, description: Nombre del rol, schema: { type: string }, example: Operador }
        - { name: orden, in: query, schema: { type: string, enum: [id, nombre, correo, recientes], default: id }, example: nombre }
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/Tamano' }
      responses:
        '200':
          description: Página de usuarios
          content:
            application/json:
              example:
                total: 1
                pagina: 1
                tamano: 20
                datos: [{ IDUsuario: 2, Correo: operador@shopcart.test, Nombre: Óscar Operador, Rol: Operador, Activo: true }]
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
    post:
      tags: [Usuarios]
      summary: Crea un usuario con un rol activo (permiso usuarios.gestionar)
      description: Solo el Administrador asigna el rol Administrador. Un rol inexistente o inactivo responde 400.
      requestBody:
        required: true
        content:
          application/json:
            example: { correo: operador2@shopcart.test, clave: Clave-segura-1, nombre: Olga Operadora, rol: Operador }
      responses:
        '201':
          description: Usuario creado
          content: { application/json: { example: { IDUsuario: 5, Correo: operador2@shopcart.test, Nombre: Olga Operadora, Rol: Operador, Activo: true } } }
        '409': { $ref: '#/components/responses/Conflicto' }
        '403': { $ref: '#/components/responses/Prohibido' }
  /admin/usuarios/{id}:
    patch:
      tags: [Usuarios]
      summary: Cambia el rol o desactiva un usuario, nunca se borra (permiso usuarios.gestionar)
      description: |
        Cambiar el rol o desactivar cierra las sesiones del usuario. Nadie cambia su propio rol ni se desactiva (409).
        Solo el Administrador asigna ese rol o modifica a un administrador (403).
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            example: { activo: false }
      responses:
        '200':
          description: Usuario actualizado
          content: { application/json: { example: { IDUsuario: 4, Correo: cliente2@shopcart.test, Nombre: Carlos Cliente, Rol: Cliente, Activo: false } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /admin/permisos:
    get:
      tags: [Roles]
      summary: Catálogo de permisos (permiso roles.gestionar)
      description: Si Asignable es falso, ningún rol puede recibir ese permiso; hoy es el caso de roles.gestionar.
      responses:
        '200':
          description: Permisos
          content:
            application/json:
              example: [{ IDPermiso: 1, Codigo: pedidos.ver, Modulo: Pedidos, Descripcion: Consultar pedidos y devoluciones, Asignable: true }]
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
  /admin/roles:
    get:
      tags: [Roles]
      summary: Lista los roles con sus permisos (permiso roles.gestionar)
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Rol' } }
        '403': { $ref: '#/components/responses/Prohibido' }
    post:
      tags: [Roles]
      summary: Crea un rol con sus permisos (permiso roles.gestionar)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolEntrada' }
            example: { nombre: Marketing, descripcion: Cupones y reportes, permisos: [cupones.gestionar, reportes.ver] }
      responses:
        '201':
          description: Rol creado
          content: { application/json: { schema: { $ref: '#/components/schemas/Rol' } } }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /admin/roles/{id}:
    get:
      tags: [Roles]
      summary: Consulta un rol (permiso roles.gestionar)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Rol
          content: { application/json: { schema: { $ref: '#/components/schemas/Rol' } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    put:
      tags: [Roles]
      summary: Reemplaza un rol o lo desactiva con activo en falso (permiso roles.gestionar)
      description: |
        No hay ruta para borrar. Responde 409 si es un rol de sistema o si se desactiva con usuarios activos,
        y 400 si los permisos incluyen `roles.gestionar` o un código inexistente. El cambio tiene efecto inmediato.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolActualizacion' }
            example: { nombre: Marketing, descripcion: Solo cupones, activo: true, permisos: [cupones.gestionar] }
      responses:
        '200':
          description: Rol actualizado
          content: { application/json: { schema: { $ref: '#/components/schemas/Rol' } } }
        '400': { $ref: '#/components/responses/Validacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }

  /admin/categorias:
    get:
      tags: [Catálogo]
      summary: Lista categorías (permiso catalogo.gestionar)
      parameters:
        - { name: incluirInactivas, in: query, schema: { type: boolean, default: false }, example: true }
      responses:
        '200':
          description: Categorías
          content: { application/json: { example: [{ IDCategoria: 1, Nombre: Electrónica, Descripcion: 'Audio, video y accesorios', Activa: true }] } }
        '403': { $ref: '#/components/responses/Prohibido' }
    post:
      tags: [Catálogo]
      summary: Crea una categoría (permiso catalogo.gestionar)
      requestBody:
        required: true
        content: { application/json: { example: { nombre: Mascotas, descripcion: Alimento y accesorios } } }
      responses:
        '201':
          description: Categoría creada
          content: { application/json: { example: { IDCategoria: 9, Nombre: Mascotas, Descripcion: Alimento y accesorios, Activa: true } } }
        '409': { $ref: '#/components/responses/Conflicto' }
        '403': { $ref: '#/components/responses/Prohibido' }
  /admin/categorias/{id}:
    put:
      tags: [Catálogo]
      summary: Modifica una categoría (permiso catalogo.gestionar)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { example: { nombre: Mascotas y más, descripcion: null, activa: true } } }
      responses:
        '200':
          description: Categoría actualizada
          content: { application/json: { example: { IDCategoria: 9, Nombre: Mascotas y más, Descripcion: null, Activa: true } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    delete:
      tags: [Catálogo]
      summary: Elimina la categoría o, si tiene productos, la desactiva (permiso catalogo.gestionar)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Resultado
          content: { application/json: { example: { Resultado: Desactivada } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /admin/productos:
    get:
      tags: [Catálogo]
      summary: Catálogo de administración con productos inactivos y sin variantes (permiso catalogo.gestionar)
      parameters:
        - { name: texto, in: query, schema: { type: string, maxLength: 100 }, example: Hub }
        - { name: idCategoria, in: query, schema: { type: integer }, example: 2 }
        - { name: activo, in: query, description: Sin valor muestra activos e inactivos, schema: { type: boolean }, example: false }
        - { name: orden, in: query, schema: { type: string, enum: [nombre, recientes], default: nombre }, example: recientes }
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/Tamano' }
      responses:
        '200':
          description: Página de productos
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Pagina' }
                  - type: object
                    properties:
                      datos: { type: array, items: { $ref: '#/components/schemas/ProductoAdministracion' } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
    post:
      tags: [Catálogo]
      summary: Crea un producto (permiso catalogo.gestionar)
      requestBody:
        required: true
        content: { application/json: { example: { idCategoria: 2, nombre: Hub USB-C, descripcion: Hub de 4 puertos } } }
      responses:
        '201': { $ref: '#/components/responses/Producto' }
        '403': { $ref: '#/components/responses/Prohibido' }
  /admin/productos/{id}:
    get:
      tags: [Catálogo]
      summary: Producto con variantes, incluidos los inactivos (permiso catalogo.gestionar)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Producto' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    put:
      tags: [Catálogo]
      summary: Modifica o desactiva un producto (permiso catalogo.gestionar)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { example: { idCategoria: 2, nombre: Hub USB-C 4 puertos, descripcion: null, activo: true } } }
      responses:
        '200': { $ref: '#/components/responses/Producto' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    delete:
      tags: [Catálogo]
      summary: Elimina el producto; si tiene ventas, reservas, carritos o movimientos lo desactiva (permiso catalogo.gestionar)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Resultado
          content: { application/json: { example: { Resultado: Desactivado } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /admin/productos/{id}/variantes:
    post:
      tags: [Catálogo]
      summary: Agrega una variante con SKU único, atributos, precio y existencia inicial (permiso catalogo.gestionar)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { example: { sku: COM-HUB-001, atributos: { Color: Gris }, precio: 149, existenciaInicial: 20 } } }
      responses:
        '201': { $ref: '#/components/responses/Producto' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /admin/productos/{id}/imagenes:
    post:
      tags: [Catálogo]
      summary: Agrega una imagen al producto; la de menor orden es la principal (permiso catalogo.gestionar)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImagenEntrada' }
            example: { url: 'https://ejemplo.com/hub-frente.jpg', textoAlternativo: Hub USB-C de frente, orden: 0 }
      responses:
        '201': { $ref: '#/components/responses/Producto' }
        '400': { $ref: '#/components/responses/Validacion' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /admin/productos/imagenes/{idImagen}:
    delete:
      tags: [Catálogo]
      summary: Quita una imagen del producto (permiso catalogo.gestionar)
      parameters:
        - { name: idImagen, in: path, required: true, schema: { type: integer, minimum: 1 }, example: 1 }
      responses:
        '200': { $ref: '#/components/responses/Producto' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /admin/productos/variantes/{idVariante}:
    put:
      tags: [Catálogo]
      summary: Modifica SKU, atributos, precio o estado de una variante (permiso catalogo.gestionar)
      parameters:
        - { name: idVariante, in: path, required: true, schema: { type: integer }, example: 1 }
      requestBody:
        required: true
        content: { application/json: { example: { sku: COM-HUB-001, atributos: { Color: Gris }, precio: 139, activa: true } } }
      responses:
        '200': { $ref: '#/components/responses/Producto' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /admin/inventario/existencias:
    get:
      tags: [Inventario]
      summary: Existencia, reservado y disponible por variante (permiso inventario.ver)
      parameters:
        - { name: umbral, in: query, description: Solo variantes con disponible igual o menor, schema: { type: integer }, example: 5 }
        - { name: orden, in: query, schema: { type: string, enum: [disponible, disponible_desc, sku, producto], default: disponible }, example: sku }
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/Tamano' }
      responses:
        '200':
          description: Página de existencias
          content:
            application/json:
              example:
                total: 1
                pagina: 1
                tamano: 20
                datos: [{ IDVariante: 61, SKU: JUG-PEL-001, Producto: Pelota saltarina, Atributos: '{}', Existencia: 0, Reservado: 0, Disponible: 0 }]
        '403': { $ref: '#/components/responses/Prohibido' }
  /admin/inventario/variantes/{id}/kardex:
    get:
      tags: [Inventario]
      summary: Kardex de una variante (permiso inventario.ver)
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: orden, in: query, description: Por orden de registro, schema: { type: string, enum: [recientes, antiguos], default: recientes }, example: antiguos }
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/Tamano' }
      responses:
        '200':
          description: Movimientos, el más reciente primero
          content:
            application/json:
              example:
                total: 1
                pagina: 1
                tamano: 20
                datos: [{ IDKardex: 1, IDVariante: 1, Tipo: Entrada, Cantidad: 40, ExistenciaResultante: 40, Motivo: Inventario inicial, IDUsuario: 1, Usuario: Ana Administradora, IDPedido: null, Fecha: '2026-11-01T10:00:00.000Z' }]
  /admin/inventario/movimientos:
    post:
      tags: [Inventario]
      summary: Registra entrada, salida o ajuste con motivo; no deja la existencia en negativo ni por debajo de lo reservado (permiso inventario.gestionar)
      requestBody:
        required: true
        content: { application/json: { example: { idVariante: 1, tipo: Ajuste, cantidad: -2, motivo: Conteo físico } } }
      responses:
        '201':
          description: Movimiento registrado
          content: { application/json: { example: { IDKardex: 70, IDVariante: 1, Tipo: Ajuste, Cantidad: -2, ExistenciaResultante: 38, Motivo: Conteo físico, Fecha: '2026-11-01T10:00:00.000Z' } } }
        '409': { $ref: '#/components/responses/Conflicto' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /admin/cupones:
    get:
      tags: [Cupones]
      summary: Lista cupones (permiso cupones.gestionar)
      parameters:
        - { name: orden, in: query, description: vence = fecha final más próxima primero; usos = más usados primero, schema: { type: string, enum: [id, codigo, vence, usos], default: id }, example: vence }
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/Tamano' }
      responses:
        '200':
          description: Página de cupones
          content:
            application/json:
              example:
                total: 1
                pagina: 1
                tamano: 20
                datos: [{ IDCupon: 1, Codigo: BIENVENIDA10, Tipo: Porcentaje, Valor: 10, MinimoCompra: 0, LimiteTotal: null, LimitePorCliente: 1, Usos: 0, IDCategoria: null, Activo: true }]
        '403': { $ref: '#/components/responses/Prohibido' }
    post:
      tags: [Cupones]
      summary: Crea un cupón (permiso cupones.gestionar)
      requestBody:
        required: true
        content:
          application/json:
            example: { codigo: NOVIEMBRE5, tipo: Monto, valor: 5, fechaInicio: '2026-11-01T00:00:00Z', fechaFin: '2026-11-30T23:59:59Z', minimoCompra: 50, limiteTotal: 200, limitePorCliente: 1, idCategoria: null }
      responses:
        '201':
          description: Cupón creado
          content: { application/json: { example: { IDCupon: 7, Codigo: NOVIEMBRE5, Tipo: Monto, Valor: 5, Usos: 0, Activo: true } } }
        '409': { $ref: '#/components/responses/Conflicto' }
  /admin/cupones/{id}:
    put:
      tags: [Cupones]
      summary: Modifica o desactiva un cupón (permiso cupones.gestionar)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            example: { tipo: Monto, valor: 5, fechaInicio: '2026-11-01T00:00:00Z', fechaFin: '2026-11-30T23:59:59Z', minimoCompra: 50, limiteTotal: 200, limitePorCliente: 1, idCategoria: null, activo: false }
      responses:
        '200':
          description: Cupón actualizado
          content: { application/json: { example: { IDCupon: 7, Codigo: NOVIEMBRE5, Activo: false } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /admin/pedidos:
    get:
      tags: [Pedidos, Dashboard]
      summary: Pedidos filtrados y paginados (permiso pedidos.ver)
      parameters:
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoPedido' }, example: Pagado }
        - { name: desde, in: query, schema: { type: string, format: date }, example: '2026-11-01' }
        - { name: hasta, in: query, schema: { type: string, format: date }, example: '2026-11-30' }
        - { name: idCliente, in: query, schema: { type: integer }, example: 3 }
        - { name: totalMin, in: query, schema: { type: number }, example: 100 }
        - { name: totalMax, in: query, schema: { type: number }, example: 2000 }
        - { name: orden, in: query, schema: { type: string, enum: [recientes, antiguos, total_desc, total_asc], default: recientes }, example: total_desc }
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/Tamano' }
      responses:
        '200':
          description: Página de pedidos
          content:
            application/json:
              example:
                total: 1
                pagina: 1
                tamano: 20
                datos: [{ IDPedido: 1, IDUsuario: 3, Cliente: Carla Cliente, Estado: Pagado, Subtotal: 1036.8, Descuento: 50, Total: 986.8, FechaCreacion: '2026-11-01T15:34:19.000Z' }]
  /admin/pedidos/{id}:
    get:
      tags: [Pedidos]
      summary: Pedido con líneas e historial (permiso pedidos.ver)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Pedido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /admin/pedidos/{id}/estado:
    patch:
      tags: [Pedidos]
      summary: Avanza o cancela un pedido (permiso pedidos.gestionar)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { example: { estado: EnPreparacion, comentario: Empacando } } }
      responses:
        '200': { $ref: '#/components/responses/Pedido' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /admin/pedidos/{id}/devoluciones:
    get:
      tags: [Pedidos]
      summary: Devoluciones de un pedido (permiso pedidos.ver)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Devoluciones' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    post:
      tags: [Pedidos]
      summary: Registra una devolución total o parcial por línea (permiso pedidos.gestionar)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            example: { motivo: Producto defectuoso, lineas: [{ idPedidoDetalle: 1, cantidad: 1 }] }
      responses:
        '201': { $ref: '#/components/responses/Devoluciones' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /admin/dashboard/ventas:
    get:
      tags: [Dashboard]
      summary: Ventas netas y pedidos por día, semana o mes (permiso reportes.ver)
      parameters:
        - { name: agrupacion, in: query, schema: { type: string, enum: [Dia, Semana, Mes] }, example: Semana }
        - { name: desde, in: query, schema: { type: string, format: date }, example: '2026-11-01' }
        - { name: hasta, in: query, schema: { type: string, format: date }, example: '2026-11-30' }
      responses:
        '200':
          description: Serie de ventas
          content: { application/json: { example: [{ Periodo: '2026-10-26T00:00:00.000Z', Pedidos: 3, Ventas: 2450.5 }] } }
        '403': { $ref: '#/components/responses/Prohibido' }
  /admin/dashboard/categorias:
    get:
      tags: [Dashboard]
      summary: Ventas netas por categoría (permiso reportes.ver)
      parameters:
        - { name: desde, in: query, schema: { type: string, format: date }, example: '2026-11-01' }
        - { name: hasta, in: query, schema: { type: string, format: date }, example: '2026-11-30' }
      responses:
        '200':
          description: Ventas por categoría
          content: { application/json: { example: [{ IDCategoria: 1, Categoria: Electrónica, Unidades: 12, Ventas: 3890.2 }] } }
  /admin/dashboard/top-productos:
    get:
      tags: [Dashboard]
      summary: Productos más vendidos (permiso reportes.ver)
      parameters:
        - { name: cantidad, in: query, schema: { type: integer, default: 10 }, example: 10 }
        - { name: desde, in: query, schema: { type: string, format: date }, example: '2026-11-01' }
        - { name: hasta, in: query, schema: { type: string, format: date }, example: '2026-11-30' }
      responses:
        '200':
          description: Top por unidades netas
          content: { application/json: { example: [{ IDProducto: 1, Producto: Audífonos inalámbricos, Unidades: 8, Ventas: 2540 }] } }
  /admin/dashboard/indicadores:
    get:
      tags: [Dashboard]
      summary: Pedidos, ventas, ticket promedio y carritos abandonados (permiso reportes.ver)
      description: |
        `Pedidos` y `Ventas` cuentan los pedidos completados (Entregado o DevueltoParcial) con su venta neta de devoluciones.
        `TicketPromedio` = `MontoVendido` / `PedidosPagados`: total cobrado entre el número de pedidos pagados (todos menos los cancelados) del periodo.
      parameters:
        - { name: horas, in: query, description: Horas sin cambios para considerar abandonado un carrito, schema: { type: integer, default: 24 }, example: 24 }
        - { name: desde, in: query, schema: { type: string, format: date }, example: '2026-11-01' }
        - { name: hasta, in: query, schema: { type: string, format: date }, example: '2026-11-30' }
      responses:
        '200':
          description: Indicadores
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Indicadores' }
              example: { Pedidos: 9, Ventas: 9707.8, PedidosPagados: 13, MontoVendido: 11509.8, TicketPromedio: 885.37, CarritosAbandonados: 3 }
  /admin/dashboard/carritos-abandonados:
    get:
      tags: [Dashboard]
      summary: Carritos abiertos con productos y sin cambios recientes (permiso reportes.ver)
      parameters:
        - { name: horas, in: query, schema: { type: integer, default: 24 }, example: 24 }
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/Tamano' }
      responses:
        '200':
          description: Página de carritos
          content:
            application/json:
              example:
                total: 1
                pagina: 1
                tamano: 20
                datos: [{ IDCarrito: 4, IDUsuario: 3, Correo: cliente@shopcart.test, FechaActualizacion: '2026-10-30T09:00:00.000Z', Lineas: 2, Valor: 478.9 }]

  /admin/bitacora:
    get:
      tags: [Bitácora]
      summary: Consulta la bitácora, filtrable por módulo (permiso bitacora.ver). Es de solo lectura
      parameters:
        - { name: modulo, in: query, schema: { type: string, enum: [Catalogo, Inventario, Cupones, Pedidos, Roles] }, example: Pedidos }
        - { name: orden, in: query, schema: { type: string, enum: [recientes, antiguos], default: recientes }, example: antiguos }
        - { name: desde, in: query, schema: { type: string, format: date }, example: '2026-11-01' }
        - { name: hasta, in: query, schema: { type: string, format: date }, example: '2026-11-30' }
        - { $ref: '#/components/parameters/Pagina' }
        - { $ref: '#/components/parameters/Tamano' }
      responses:
        '200':
          description: Página de registros
          content:
            application/json:
              example:
                total: 1
                pagina: 1
                tamano: 20
                datos: [{ IDBitacora: 121, Fecha: '2026-11-01T15:37:57.000Z', IDUsuario: 2, Usuario: Óscar Operador, Modulo: Pedidos, Entidad: Pedido, IDEntidad: 1, Accion: Modificacion, ValorAnterior: '{"Estado":"Despachado"}', ValorNuevo: '{"Estado":"Entregado"}' }]
        '403': { $ref: '#/components/responses/Prohibido' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
      example: 1
    Pagina:
      name: pagina
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
      example: 1
    Tamano:
      name: tamano
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      example: 20
  schemas:
    Rol:
      type: object
      properties:
        IDRol: { type: integer }
        Nombre: { type: string }
        Descripcion: { type: string, nullable: true }
        EsSistema: { type: boolean, description: Los roles de sistema no se editan ni se desactivan }
        Activo: { type: boolean }
        FechaCreacion: { type: string, format: date-time }
        UsuariosActivos: { type: integer }
        permisos: { type: array, items: { type: string } }
      example: { IDRol: 2, Nombre: Operador, Descripcion: Gestiona pedidos e inventario., EsSistema: false, Activo: true, FechaCreacion: '2026-11-01T15:00:00.000Z', UsuariosActivos: 1, permisos: [inventario.gestionar, inventario.ver, pedidos.gestionar, pedidos.ver] }
    EstadoPedido:
      type: string
      enum: [Pagado, EnPreparacion, Despachado, Entregado, DevueltoParcial, Devuelto, Cancelado]
    Pagina:
      type: object
      properties:
        total: { type: integer, description: Filas que cumplen el filtro }
        pagina: { type: integer }
        tamano: { type: integer }
    ImagenEntrada:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri, maxLength: 500, description: Dirección http o https }
        textoAlternativo: { type: string, maxLength: 150, nullable: true }
        orden: { type: integer, minimum: 0, default: 0 }
    ProductoAdministracion:
      type: object
      properties:
        IDProducto: { type: integer }
        Nombre: { type: string }
        IDCategoria: { type: integer }
        Categoria: { type: string }
        CategoriaActiva: { type: boolean }
        Activo: { type: boolean }
        FechaCreacion: { type: string, format: date-time }
        Variantes: { type: integer, description: 0 si el producto no tiene variantes }
        VariantesActivas: { type: integer }
        PrecioDesde: { type: number, nullable: true }
        PrecioHasta: { type: number, nullable: true }
        Existencia: { type: integer }
        Disponible: { type: integer }
        ImagenPrincipal: { type: string, nullable: true }
      example: { IDProducto: 51, Nombre: Hub USB-C, IDCategoria: 2, Categoria: Computación, CategoriaActiva: true, Activo: false, FechaCreacion: '2026-11-01T15:00:00.000Z', Variantes: 0, VariantesActivas: 0, PrecioDesde: null, PrecioHasta: null, Existencia: 0, Disponible: 0, ImagenPrincipal: null }
    Indicadores:
      type: object
      properties:
        Pedidos: { type: integer, description: Pedidos completados (Entregado o DevueltoParcial) }
        Ventas: { type: number, description: Venta neta de devoluciones de los pedidos completados }
        PedidosPagados: { type: integer, description: Pedidos del periodo menos los cancelados }
        MontoVendido: { type: number, description: Total cobrado de los pedidos pagados }
        TicketPromedio: { type: number, description: MontoVendido / PedidosPagados }
        CarritosAbandonados: { type: integer }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            codigo: { type: string }
            mensaje: { type: string }
            detalle: {}
    RolEntrada:
      type: object
      required: [nombre, permisos]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 20 }
        descripcion: { type: string, maxLength: 200, nullable: true }
        permisos: { type: array, items: { type: string }, description: Códigos de GET /admin/permisos }
    RolActualizacion:
      allOf:
        - { $ref: '#/components/schemas/RolEntrada' }
        - type: object
          properties:
            activo: { type: boolean, default: true }
  responses:
    Validacion:
      description: Datos inválidos (400)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { codigo: VALIDACION, mensaje: Datos inválidos, detalle: [{ campo: cantidad, mensaje: 'Too small: expected number to be >=1' }] } }
    NoAutenticado:
      description: Sin token, token inválido o expirado (401)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { codigo: TOKEN_EXPIRADO, mensaje: El token expiró } }
    Prohibido:
      description: Falta el permiso (403)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { codigo: PROHIBIDO, mensaje: No tiene permiso para este recurso } }
    NoEncontrado:
      description: No existe o no es del usuario (404)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { codigo: NEGOCIO, mensaje: El pedido no existe. } }
    Conflicto:
      description: Choca con el estado actual (409)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { codigo: NEGOCIO, mensaje: La cantidad supera el disponible. } }
    Sesion:
      description: Sesión abierta
      content:
        application/json:
          example:
            accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            refreshToken: q3b1vH0...token-de-un-solo-uso
            expiresIn: 900
            usuario: { id: 1, correo: admin@shopcart.test, nombre: Ana Administradora, rol: Administrador }
    Producto:
      description: Producto con variantes
      content:
        application/json:
          example:
            IDProducto: 1
            Nombre: Audífonos inalámbricos
            Descripcion: Audífonos Bluetooth con estuche de carga
            IDCategoria: 1
            Categoria: Electrónica
            Activo: true
            variantes: [{ IDVariante: 1, SKU: ELE-AUD-NEG, Atributos: { Color: Negro }, Precio: 349, Activa: true, Existencia: 40, Reservado: 0, Disponible: 40 }]
            imagenes: [{ IDProductoImagen: 1, Url: 'https://picsum.photos/seed/shopcart-1/600/600', TextoAlternativo: Audífonos inalámbricos, Orden: 0 }]
    Pedido:
      description: Pedido con líneas e historial
      content:
        application/json:
          example:
            IDPedido: 1
            IDUsuario: 3
            Cliente: Carla Cliente
            Estado: Pagado
            Cupon: Q50
            Subtotal: 1036.8
            Descuento: 50
            Total: 986.8
            IVA: 105.73
            IDDireccion: 1
            Direccion: 6a avenida 12-34 zona 1
            Ciudad: Guatemala
            Telefono: '55551234'
            ReferenciaPago: SIM-741A8A6C-9C9D-4A7D-977A-703C1F7BFDBF
            lineas: [{ IDPedidoDetalle: 1, IDVariante: 1, SKU: ELE-AUD-NEG, Producto: Audífonos inalámbricos, Cantidad: 2, PrecioUnitario: 349, Descuento: 33.66, CantidadDevuelta: 0 }]
            historial: [{ EstadoAnterior: null, EstadoNuevo: Pagado, IDUsuario: 3, Usuario: Carla Cliente, Comentario: Pedido creado }]
    Devoluciones:
      description: Devoluciones del pedido con sus líneas
      content:
        application/json:
          example:
            - IDDevolucion: 1
              IDPedido: 1
              IDUsuario: 2
              Motivo: Producto defectuoso
              Monto: 314.1
              lineas: [{ IDDevolucion: 1, IDPedidoDetalle: 1, SKU: ELE-AUD-NEG, Cantidad: 1, Monto: 314.1 }]
