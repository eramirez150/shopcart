# Los dos servicios de la API usan la misma imagen, la misma base y los mismos SP.
x-api: &api
  build: ./api
  depends_on:
    db-init:
      condition: service_completed_successfully

x-api-entorno: &api-entorno
  DB_HOST: db
  DB_PORT: "1433"
  DB_NAME: ${DB_NAME:-ShopCart}
  DB_USER: shopcart_app
  DB_PASSWORD: ${APP_DB_PASSWORD:?Definir APP_DB_PASSWORD en .env}
  JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET en .env}

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Definir MSSQL_SA_PASSWORD en .env}
    ports:
      - "127.0.0.1:${DB_PORT:-14335}:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Definir MSSQL_SA_PASSWORD en .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Definir APP_DB_PASSWORD en .env}
      DB_NAME: ${DB_NAME:-ShopCart}
    volumes:
      - ./database:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/aplicar.sh"]
    restart: "no"

  api-tienda:
    <<: *api
    command: ["node", "dist/tienda/index.js"]
    environment:
      <<: *api-entorno
      PORT: "3000"
      CORS_ORIGIN: ${CORS_ORIGIN_TIENDA:-http://localhost:5173}
    ports:
      - "127.0.0.1:${API_TIENDA_PORT:-3000}:3000"

  api-admin:
    <<: *api
    command: ["node", "dist/admin/index.js"]
    environment:
      <<: *api-entorno
      PORT: "3001"
      CORS_ORIGIN: ${CORS_ORIGIN_ADMIN:-http://localhost:5174}
    ports:
      - "127.0.0.1:${API_ADMIN_PORT:-3001}:3001"

  # Las dos aplicaciones usan la misma receta: cambia qué compilan y a qué servicio
  # reenvían /api. Cada una ve solo su API.
  web-tienda:
    build:
      context: ./web
      args:
        VITE_APP: tienda
        VITE_MODO_DEMO: ${VITE_MODO_DEMO:-false}
    environment:
      API_DESTINO: http://api-tienda:3000
    depends_on:
      - api-tienda
    ports:
      - "127.0.0.1:${WEB_TIENDA_PORT:-8081}:8080"

  web-admin:
    build:
      context: ./web
      args:
        VITE_APP: admin
        VITE_MODO_DEMO: ${VITE_MODO_DEMO:-false}
    environment:
      API_DESTINO: http://api-admin:3001
    depends_on:
      - api-admin
    ports:
      - "127.0.0.1:${WEB_ADMIN_PORT:-8082}:8080"

volumes:
  db-data:
